'1':
  name: Zero-shot performance failure
  primary_reference: Kedzierska 2024, 2025; Boiarsky 2023
  explanation: Zero-shot predictions on the scFM embedding are below the F1 / ARI
    bands reported for the failing scFMs in Kedzierska 2024.
  metric_thresholds:
  - metric: isolated_f1
    op: <
    threshold: 0.5
    citation: Kedzierska 2024
  - metric: adj_rand_index
    op: <
    threshold: 0.3
    citation: Kedzierska 2025
'2':
  name: Baselines outperform scFM
  primary_reference: Liu 2024; Souza & Mehta 2026; DenAdel 2025
  explanation: For every metric, the scFM embedding scores below the PCA baseline
    by more than the margin reported in Liu 2024 and Souza & Mehta 2026.
  metric_thresholds:
  - metric: silhouette_delta_vs_pca
    op: <
    threshold: -0.01
    citation: Liu 2024
  - metric: isolated_f1_delta_vs_pca
    op: <
    threshold: -0.01
    citation: Souza & Mehta 2026
'3':
  name: Pretraining scaling laws do not apply
  primary_reference: DenAdel 2025; Wang 2025
  explanation: Performance plateaus before 10% of the data, reproducing the DenAdel
    2025 scaling finding.
  metric_thresholds:
  - metric: plateau_ratio
    op: <
    threshold: 1.1
    citation: DenAdel 2025
'4':
  name: Batch effects persist
  primary_reference: Wang, Zhang & Zhang 2025
  explanation: 'Batch effects dominate the embedding: kBET rejection is high and iLISI
    is low, matching the 8 scFMs evaluated by Wang, Zhang & Zhang 2025.'
  metric_thresholds:
  - metric: kbet
    op: '>'
    threshold: 0.5
    citation: Wang, Zhang & Zhang 2025
  - metric: ilisi
    op: <
    threshold: 0.3
    citation: Wang, Zhang & Zhang 2025
  - metric: pcr
    op: '>'
    threshold: 0.85
    citation: Wang, Zhang & Zhang 2025
  - metric: graph_connectivity
    op: <
    threshold: 0.5
    citation: Wang, Zhang & Zhang 2025
'5':
  name: Tokenization and representation failures
  primary_reference: Atti & Subramaniam 2025; DenAdel 2025; Haber 2025
  explanation: 'Tokenization / representation causes information loss: rare-type recall
    is much lower than common-type recall (scGPT CD14 finding) and dCor to raw X is
    below the Atti & Subramaniam 2025 band.'
  metric_thresholds:
  - metric: rare_common_gap
    op: '>'
    threshold: 0.15
    citation: Atti & Subramaniam 2025
  - metric: dCor_vs_pca
    op: <
    threshold: 0.5
    citation: Atti & Subramaniam 2025
'6':
  name: Generalization failures across domains
  primary_reference: Souza & Mehta 2026; Boiarsky 2023; Wenteler 2024
  explanation: For at least 50% of (train, test) domain pairs the ARI on the test
    domain is below the Souza & Mehta 2026 band.
  metric_thresholds:
  - metric: cross_domain_ari_mean
    op: <
    threshold: 0.3
    citation: Souza & Mehta 2026
'7':
  name: Real-world clinical / translational failures
  primary_reference: Elmarakeby 2025; Csendes 2025
  explanation: Patient-level separation and outcome prediction are below the Elmarakeby
    2025 cancer benchmarks.
  metric_thresholds:
  - metric: asw_patient
    op: <
    threshold: 0.05
    citation: Elmarakeby 2025
  - metric: outcome_AUC
    op: <
    threshold: 0.6
    citation: Elmarakeby 2025
'8':
  name: Model stability and interpretability issues
  primary_reference: Liu 2024; Xu 2026
  explanation: Coefficient of variation across random subsamples is above the Liu
    2024 / Xu 2026 instability band on at least two metrics.
  metric_thresholds:
  - metric: stability_cv_mean
    op: '>'
    threshold: 0.1
    citation: Liu 2024
'9':
  name: Denoising hypothesis (linear manifold)
  primary_reference: Souza & Mehta 2026
  explanation: "scFM \u2264 PCA+\u03B4 on at least 80% of metrics, matching the Souza\
    \ & Mehta 2026 'denoiser only' finding."
  metric_thresholds:
  - metric: baseline_competitiveness
    op: <
    threshold: 0.2
    citation: Souza & Mehta 2026
