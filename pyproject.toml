[tool.poetry]
name = "checkatlas"
version = "0.7.7"
description="One liner tool to check the quality of your single-cell atlases."
authors = ["becavin-lab"]
readme = "README.md"
license = "BSD 3-Clause"
packages = [{include = "checkatlas"}]
include = ["checkatlas/checkatlas_workflow.nf","pyproject.toml"]
exclude = ["tests/", ".github", "*dask-worker-space*"]
homepage = "https://checkatlas.readthedocs.io/"
repository = "https://github.com/becavin-lab/checkatlas/"
documentation = "https://checkatlas.readthedocs.io/"


[tool.poetry.dependencies]
python = ">=3.12"
scikit-learn = ">=1.7.0"
scanpy = ">=1.12"
multiqc = {version = ">=1.35", python = ">=3.12, !=3.14.1"}
# JAX is optional — install the group that matches your hardware (see below)
jax = {version = "^0.10.1", optional = true}
nextflow = "^26.4.3"

[tool.poetry.extras]
# pip install checkatlas[cpu]        → CPU-only JAX
# pip install checkatlas[cuda13]     → NVIDIA CUDA 13 (then: pip install -U "jax[cuda13]")
# pip install checkatlas[tpu]        → Google Cloud TPU (then: pip install -U "jax[tpu]")
# ROCm: pip install checkatlas, then: pip install -U "jax[rocm7-local]"
cpu    = ["jax"]
cuda13 = ["jax"]
tpu    = ["jax"]

# Poetry groups (poetry install --with jax-cpu / jax-cuda13 / jax-rocm / jax-tpu)
[tool.poetry.group.jax-cpu]
optional = true

[tool.poetry.group.jax-cpu.dependencies]
jax = "^0.10.1"

[tool.poetry.group.jax-cuda13]
optional = true

[tool.poetry.group.jax-cuda13.dependencies]
jax = {version = "^0.10.1", extras = ["cuda13"]}

# ROCm: jax[rocm7-local] requires system ROCm packages not on PyPI — install manually:
#   pip install -U "jax[rocm7-local]"

[tool.poetry.group.jax-tpu]
optional = true

[tool.poetry.group.jax-tpu.dependencies]
jax = {version = "^0.10.1", extras = ["tpu"]}


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocstrings = {version = "^0.27.0", extras = ["python"]}
pymdown-extensions = "^10.0"

[tool.poetry.group.dev.dependencies]
setuptools = "^80.9.0"
gitchangelog = "^3.0.4"
black = {extras = ["jupyter"], version = "^26.5.1"}
flake8 = "^7.3.0"
pytest-cov = "^6.2.1"
isort = "^6.0.1"
mypy = "^1.16.1"
no-implicit-optional = "^1.4"

[tool.mypy]
no_implicit_optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
checkatlas = 'checkatlas.__main__:main'
checkatlas-workflow = 'checkatlas.checkatlas_workflow:main'
